
name: Extract Android Source ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source code
        run: |
          ZIP_FILE="folioflow-nov-21-2026-9-28-25-pm.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Source ZIP not found!"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/source"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/source"

          PROJECT_FILE=$(find "$RUNNER_TEMP/source" \
            -name settings.gradle.kts \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Android Gradle project not found!"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PROJECT_FILE")

          cp -a "$PROJECT_ROOT"/. .

          rm -f "$ZIP_FILE"

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract Android source code"
            git push
          else
            echo "No changes to commit"
          fi
          
